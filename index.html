<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MapLibre 3D Globe Map</title>

    <link href="https://unpkg.com/maplibre-gl@^5.0.0/dist/maplibre-gl.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="titleBox">
        <h1>Famous baseball player trajectoty map</h1>
        <p>野球選手の軌跡を見れるマップ</p>
    </div>

    <div id="searchBox">
        <input id="searchInput" type="text" placeholder="検索欄に条件を入力">
        <button id="searchButton">検索</button>
    </div>

    <div id="map"></div>

    <div id="memberBox">

    <button id="memberButton">
        メンバー紹介
    </button>

    <div id="memberPanel">

        <div class="memberCard">
            <img src="member1.jpg" alt="メンバー1">
            <h3>名前：山田 太郎</h3>
            <p><strong>担当：</strong>地図制作</p>
            <p><strong>役職：</strong>リーダー</p>
            <p><strong>一言：</strong>見やすい地図を目指しました。</p>
        </div>

        <div class="memberCard">
            <img src="member2.jpg" alt="メンバー2">
            <h3>名前：佐藤 花子</h3>
            <p><strong>担当：</strong>デザイン</p>
            <p><strong>役職：</strong>UI担当</p>
            <p><strong>一言：</strong>使いやすさを意識しました。</p>
        </div>

        <div class="memberCard">
            <img src="member3.jpg" alt="メンバー3">
            <h3>名前：鈴木 一郎</h3>
            <p><strong>担当：</strong>資料調査</p>
            <p><strong>役職：</strong>情報収集担当</p>
            <p><strong>一言：</strong>正確な情報を集めました。</p>
        </div>

        <div class="memberCard">
            <img src="member4.jpg" alt="メンバー4">
            <h3>名前：田中 美咲</h3>
            <p><strong>担当：</strong>発表</p>
            <p><strong>役職：</strong>プレゼン担当</p>
            <p><strong>一言：</strong>分かりやすく伝えます。</p>
        </div>

    </div>

</div>

    <script src="https://unpkg.com/maplibre-gl@^5.0.0/dist/maplibre-gl.js"></script>
    <script src="script.js"></script>

</body>

</html>
