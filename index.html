<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MapLibre 3D Globe Map</title>
    
    <link href="https://unpkg.com/maplibre-gl@^5.0.0/dist/maplibre-gl.css" rel="stylesheet" />
    <link rel="stylesheet" href="styleのコピー.css">
    
    <style>
        /* 画面いっぱいに地図を表示するための設定 */
        body { margin: 0; padding: 0; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }

        /* 検索欄 */
        #searchBox {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 10;
            background: white;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
            display: flex;
            gap: 6px;
        }

        #searchInput {
            width: 280px;
            padding: 8px;
            font-size: 14px;
            border: 1px solid #aaa;
            border-radius: 4px;
        }

        #searchButton {
            padding: 8px 12px;
            font-size: 14px;
            border: none;
            border-radius: 4px;
            background: #1e88e5;
            color: white;
            cursor: pointer;
        }

        #searchButton:hover {
            background: #1565c0;
        }

        .popup-button {
            margin-top: 8px;
            padding: 6px 10px;
            border: none;
            border-radius: 4px;
            background: #e53935;
            color: white;
            cursor: pointer;
            font-size: 13px;
        }

        .popup-button:hover {
            background: #b71c1c;
        }
    </style>
</head>
<body>

    <div id="searchBox">
        <input id="searchInput" type="text" placeholder="検索欄に条件を入力">
        <button id="searchButton">検索</button>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/maplibre-gl@^5.0.0/dist/maplibre-gl.js"></script>
    
    <script>
    // 4. 地図の初期化
    const map = new maplibregl.Map({
        container: 'map', // 地図を表示するdivのid
        style: 'https://demotiles.maplibre.org/style.json', // 地図の見た目のデータ（スタイルURL）
        center: [139.767, 35.681], // 初期の中心位置 [経度, 緯度] (ここでは東京付近)
        zoom: 1.5, // 地球全体が見えるようにズームを小さく設定
    });

    // データの定義（MapLibreは [経度(lng), 緯度(lat)] の順番）
    const locations = [
        {
            id: "hanamaki",
            lng: 141.1166,
            lat: 39.4084,
            name: "花巻東高校",
            description: "大谷翔平さんの出身高校"
        },
        {
            id: "angels",
            lng: -117.8827,
            lat: 33.8003,
            name: "エンゼルス本拠地",
            description: "Angel Stadium of Anaheim"
        }
    ];

    const hanamaki = locations.find(loc => loc.id === "hanamaki");
    const angels = locations.find(loc => loc.id === "angels");

    // 検索用データ
    // ここに別の人物名や場所名を追加すれば、今後検索対象を増やせます
    const searchTargets = {
        "大谷翔平": hanamaki,
        "おおたにしょうへい": hanamaki,
        "オオタニショウヘイ": hanamaki,
        "花巻東高校": hanamaki,
        "花巻東": hanamaki,
        "はなまきひがしこうこう": hanamaki,
        "ハナマキヒガシコウコウ": hanamaki,

        "エンゼルス": angels,
        "エンゼルス本拠地": angels,
        "エンゼルスの本拠地": angels,
        "エンゼルスタジアム": angels,
        "エンジェルスタジアム": angels,
        "Angel Stadium": angels,
        "angel stadium": angels,
        "Angels": angels,
        "angels": angels,
        "Los Angeles Angels": angels,
        "los angeles angels": angels
    };

    // 指定した場所へ移動する関数
    function moveToLocation(loc) {
        map.flyTo({
            center: [loc.lng, loc.lat],
            zoom: 15,
            speed: 0.8,
            curve: 1.2
        });
    }

    // 検索する関数
    function searchLocation() {
        const keyword = document.getElementById('searchInput').value.trim();

        if (keyword === "") {
            alert("検索欄に「大谷翔平」「花巻東高校」「エンゼルス」などを入力してください。");
            return;
        }

        const loc = searchTargets[keyword];

        if (loc) {
            moveToLocation(loc);
        } else {
            alert("見つかりませんでした。「大谷翔平」「花巻東高校」「エンゼルス」などを入力してください。");
        }
    }

    // 花巻東高校からエンゼルス本拠地までの軌跡を表示する関数
    function showTrajectory() {
        const trajectoryData = {
            type: 'FeatureCollection',
            features: [
                {
                    type: 'Feature',
                    properties: {
                        name: '花巻東高校からエンゼルス本拠地への軌跡'
                    },
                    geometry: {
                        type: 'LineString',
                        coordinates: [
                            [hanamaki.lng, hanamaki.lat],
                            [angels.lng, angels.lat]
                        ]
                    }
                }
            ]
        };

        const source = map.getSource('trajectory-source');
        if (source) {
            source.setData(trajectoryData);
        }

        if (map.getLayer('trajectory-line')) {
            map.setLayoutProperty('trajectory-line', 'visibility', 'visible');
        }

        if (map.getLayer('trajectory-arrow')) {
            map.setLayoutProperty('trajectory-arrow', 'visibility', 'visible');
        }

        // 軌跡が見やすいように太平洋側へ移動
        map.flyTo({
            center: [-170, 37],
            zoom: 2.1,
            speed: 0.8,
            curve: 1.2
        });
    }

    // 検索ボタンをクリックしたら検索
    document.getElementById('searchButton').addEventListener('click', searchLocation);

    // Enterキーでも検索できるようにする
    document.getElementById('searchInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            searchLocation();
        }
    });

    // 5. 地図のスタイルが読み込まれたら、投影法を変更し、コントロールやマーカーを追加する
    map.on('style.load', () => {
        // 地球儀表示に切り替え
        map.setProjection({
            type: 'globe'
        });

        // ナビゲーションコントロール（拡大・縮小ボタン）の追加
        map.addControl(new maplibregl.NavigationControl());

        // 軌跡用のGeoJSONソースを追加
        map.addSource('trajectory-source', {
            type: 'geojson',
            data: {
                type: 'FeatureCollection',
                features: []
            }
        });

        // 軌跡の線を追加
        map.addLayer({
            id: 'trajectory-line',
            type: 'line',
            source: 'trajectory-source',
            layout: {
                visibility: 'none',
                'line-join': 'round',
                'line-cap': 'round'
            },
            paint: {
                'line-color': '#e53935',
                'line-width': 4
            }
        });

        // 線の上に矢印を追加
        map.addLayer({
            id: 'trajectory-arrow',
            type: 'symbol',
            source: 'trajectory-source',
            layout: {
                visibility: 'none',
                'symbol-placement': 'line',
                'symbol-spacing': 120,
                'text-field': '▶',
                'text-size': 24,
                'text-keep-upright': false
            },
            paint: {
                'text-color': '#e53935',
                'text-halo-color': '#ffffff',
                'text-halo-width': 2
            }
        });

        // 配列からマーカー（ピン）を地図上に追加する
        locations.forEach(loc => {
            let popupHTML = `<strong>${loc.name}</strong>`;

            if (loc.id === "hanamaki") {
                popupHTML += `
                    <br>
                    <button
                        class="popup-button"
                        onclick="showTrajectory()"
                    >
                        大谷翔平選手の軌跡を見る
                    </button>
                `;
            } else {
                popupHTML += `<br>${loc.description}`;
            }
          

            // ポップアップ（吹き出し）を作成
            const popup = new maplibregl.Popup({ offset: 25 })
                .setHTML(popupHTML);

            // マーカーを作成して地図に追加
            new maplibregl.Marker()
                .setLngLat([loc.lng, loc.lat])
                .setPopup(popup) // ピンをクリックしたときに名前が出るようにする
                .addTo(map);
        });
    });
    </script>
</body>
</html>
